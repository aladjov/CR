# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# IMPORTANT: These hooks enforce the coding standards from docs/Coding_Practices.md
# The --no-verify flag should NOT be used. CI will reject PRs that bypass these checks.

default_install_hook_types: [pre-commit, pre-push]

repos:
  # Ruff - fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # ruff-format intentionally excluded - compact code style per Coding_Practices.md

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(html|md|csv)$|^(docs/|LICENSE|\.vscode/)'
      - id: end-of-file-fixer
        exclude: '\.(html|md|csv)$|^(docs/|LICENSE|\.vscode/)|__init__\.py$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '^docs/tutorial/'
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Local hooks for test coverage enforcement
  - repo: local
    hooks:
      # Pre-push hook: Lint check (mirrors CI lint job)
      - id: ruff-check
        name: ruff lint check (mirrors CI)
        entry: .venv/bin/python -m ruff check src/ tests/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true

      # Pre-push hook: Run tests with coverage enforcement (75% minimum)
      - id: pytest-coverage
        name: pytest with coverage (75% minimum required)
        entry: .venv/bin/python -m pytest tests/ --cov=customer_retention --cov-fail-under=75 -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true

      # Pre-commit hook: Quick syntax and import check on changed files
      - id: python-check
        name: python syntax check
        entry: .venv/bin/python -m py_compile
        language: system
        types: [python]

      # Pre-push hook: Regenerate requirements.txt files from pyproject.toml
      - id: generate-requirements
        name: generate requirements.txt from pyproject.toml
        entry: .venv/bin/python scripts/generate_requirements.py
        language: system
        pass_filenames: false
        files: 'pyproject\.toml$'
        stages: [pre-push]
        verbose: true

      # Pre-commit hook: framework/phase_map.yaml must match a fresh
      # rebuild. Runs whenever an exploration notebook or the builder
      # script itself changes. Fixes: `python scripts/build_framework_phase_map.py`
      # then stage the regenerated file.
      - id: framework-phase-map
        name: framework/phase_map.yaml up-to-date check
        entry: .venv/bin/python scripts/build_framework_phase_map.py --check
        language: system
        pass_filenames: false
        files: '^(exploration_notebooks/.*\.ipynb|scripts/build_framework_phase_map\.py)$'
        verbose: true

      # Reminder about --no-verify
      - id: no-verify-warning
        name: coverage enforcement reminder
        entry: ".venv/bin/python -c \"print('\\nRemember - CI enforces 75% coverage. PRs bypassing pre-push hooks will be rejected.\\n')\""
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true
