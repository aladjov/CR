[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --verbose
    -n auto
    --dist worksteal
markers =
    integration: integration tests
    unit: unit tests
    databricks: tests that require Databricks runtime (skipped locally)
    spark: tests that require PySpark (skipped if not available)
    slow: marks tests as slow (deselect with '-m "not slow"')
